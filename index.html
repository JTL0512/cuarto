<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet"
href="css/login.css">

</head>

<body>

<video
id="videoFondo"
autoplay
muted
loop
playsinline>

<source
src="videos/fondo.mp4"
type="video/mp4">

</video>

<div class="contenedor">

    <h1>
        🎓 Matemática 4° Básico
    </h1>

    <p>
        Ingresa tu nombre y elige un avatar
    </p>

    <input
    type="text"
    id="nombre"
    placeholder="Escribe tu nombre">

    <h2>
        Selecciona un avatar
    </h2>

    <div class="avatares">

        <img src="img/avatar1.png" class="avatar">
        <img src="img/avatar2.png" class="avatar">
        <img src="img/avatar3.png" class="avatar">
        <img src="img/avatar4.png" class="avatar">
        <img src="img/avatar5.png" class="avatar">
        <img src="img/avatar6.png" class="avatar">

    </div>

    <button
    id="btnEntrar">

        🚀 Entrar

    </button>

</div>

<script src="js/login.js"></script>

</body>
</html>
